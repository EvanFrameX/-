<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Scratch Game - Fullscreen Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0f1f;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .fullscreen-game {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .game-iframe-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .scratch-fullscreen-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            display: block;
        }

        iframe {
            display: block;
        }

        .fullscreen-game {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .game-iframe-wrapper::before {
            content: "🎮 Loading game...";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0f1f;
            color: #e0e5f0;
            font-family: 'Segoe UI', system-ui, monospace;
            font-weight: 500;
            letter-spacing: 1px;
            font-size: 1rem;
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(6px);
        }

        .game-iframe-wrapper.loaded::before {
            opacity: 0;
            visibility: hidden;
            content: none;
        }

        @media (orientation: landscape) {
            .scratch-fullscreen-iframe {
                width: 100%;
                height: 100%;
            }
        }
        
        @media (orientation: portrait) {
            .scratch-fullscreen-iframe {
                width: 100%;
                height: 100%;
            }
            
            body {
                transform: rotate(90deg);
                transform-origin: center center;
                width: 100vh;
                height: 100vw;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
            }
            
            html {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            
            .fullscreen-game {
                width: 100vh;
                height: 100vw;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
        }
    </style>
</head>
<body>
    <div class="fullscreen-game" id="fullscreenGameRoot">
        <div class="game-iframe-wrapper" id="iframeWrapper">
            <iframe 
                src="https://scratch.mit.edu/projects/_ADDRESS_/embed" // replace _ADDRESS_ with the numbers you see in the link of a shared scratch game. If it's not shared, then it wont work
                class="scratch-fullscreen-iframe" 
                frameborder="0" 
                scrolling="no" 
                allowfullscreen="true"
                allowtransparency="true"
                title="Scratch Game - Fullscreen"
                id="scratchGameIframe"
                sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-pointer-lock allow-top-navigation allow-modals"
            ></iframe>
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById('fullscreenGameRoot');
            const iframeElem = document.getElementById('scratchGameIframe');
            const wrapper = document.getElementById('iframeWrapper');
            
            function requestFullscreen(element) {
                const req = element.requestFullscreen ||
                            element.webkitRequestFullscreen ||
                            element.mozRequestFullScreen ||
                            element.msRequestFullscreen;
                if (req) {
                    req.call(element);
                }
            }
            
            function isFullscreenActive() {
                return !!(document.fullscreenElement || 
                        document.webkitFullscreenElement || 
                        document.mozFullScreenElement || 
                        document.msFullscreenElement);
            }
            
            let autoFullscreenAttempted = false;
            let fallbackListenerActive = false;
            
            function enterFullscreenSilent() {
                if (!isFullscreenActive()) {
                    requestFullscreen(document.documentElement);
                }
            }
            
            function attemptAutoFullscreen() {
                if (!autoFullscreenAttempted) {
                    autoFullscreenAttempted = true;
                    enterFullscreenSilent();
                }
            }
            
            function setupGestureFallback() {
                if (fallbackListenerActive) return;
                if (isFullscreenActive()) return;
                
                const gestureHandler = function(e) {
                    if (!isFullscreenActive()) {
                        requestFullscreen(document.documentElement);
                    }
                    document.removeEventListener('click', gestureHandler);
                    document.removeEventListener('touchstart', gestureHandler);
                    document.removeEventListener('keydown', gestureHandler);
                    fallbackListenerActive = false;
                };
                
                document.addEventListener('click', gestureHandler);
                document.addEventListener('touchstart', gestureHandler);
                document.addEventListener('keydown', gestureHandler);
                fallbackListenerActive = true;
            }
            
            function monitorFullscreenActivation() {
                setTimeout(() => {
                    if (!isFullscreenActive()) {
                        setupGestureFallback();
                    }
                }, 500);
            }
            
            function onIframeLoad() {
                if (wrapper) {
                    wrapper.classList.add('loaded');
                }
                if (iframeElem) {
                    iframeElem.focus();
                }
            }
            
            function adjustIframeSize() {
                if (iframeElem) {
                    iframeElem.style.width = '100%';
                    iframeElem.style.height = '100%';
                }
            }
            
            function init() {
                attemptAutoFullscreen();
                monitorFullscreenActivation();
                
                if (iframeElem) {
                    iframeElem.addEventListener('load', onIframeLoad);
                    if (iframeElem.contentDocument && iframeElem.contentDocument.readyState === 'complete') {
                        onIframeLoad();
                    }
                }
                
                window.addEventListener('resize', adjustIframeSize);
                window.addEventListener('orientationchange', () => {
                    setTimeout(adjustIframeSize, 30);
                });
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
